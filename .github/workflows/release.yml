# Builds a ready-to-install zip package for every new release on GitHub,
# including the PHP packages (vendor/), and attaches it to that release. Whoever
# installs the website uploads that zip file and extracts it in the folder
# above public_html: no SSH or Composer needed.
#
# To make a release: GitHub → Releases → Draft a new release → a new tag
# (for example v1.0.0) → Publish release. A few minutes later booking.zip is there.

name: Zip package

on:
  release:
    types: [published]
  # Started by hand (Actions tab), the package is only made available as a
  # download of that run, to try it without a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      # Every action pinned to a commit, not a tag a third party can move:
      # what builds the zip owners install cannot change underneath us.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Packages without development tools
        run: composer install --no-dev --optimize-autoloader --no-scripts --no-interaction --prefer-dist

      # Layout (see App\Support\Indeling): the app in booking/, the public files
      # in public_html/. Extracting it in the folder above the web root keeps
      # the app out of reach of visitors.
      # git archive leaves out everything marked export-ignore in .gitattributes
      # (tests, docker, ...). The built frontend (public/build) is in the repo.
      # VERSION makes the site clear its caches once after an update (App\Support\Release).
      # The tag name goes in through an environment variable, never pasted
      # into the script itself.
      # booking.zip.sha256: owners can check the zip is the one built here.
      - name: Build the zip
        env:
          VERSION: ${{ github.event.release.tag_name || github.sha }}
        run: |
          mkdir -p package/booking
          git archive HEAD | tar -x -C package/booking
          cp -r vendor package/booking/
          printf '%s\n' "$VERSION" > package/booking/VERSION
          mv package/booking/public package/public_html
          cd package
          zip -q -r -X ../booking.zip booking public_html
          cd ..
          sha256sum booking.zip > booking.zip.sha256

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" booking.zip booking.zip.sha256 --clobber

      - name: Download from this run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: booking
          path: |
            booking.zip
            booking.zip.sha256
